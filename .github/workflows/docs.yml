name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'firmware/atom_controller/**'
      - 'tools/build-public-firmware.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'firmware/atom_controller/**'
      - 'tools/build-public-firmware.sh'
      - '.github/workflows/docs.yml'
  # Redeploy without a new commit.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The plots are in Git LFS: without `lfs: true` the build gets pointer files, not images.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # If `npm ci` refuses the lockfile because npm 10 (Node 22) and npm 11 disagree about
      # optional platform dependencies, reconcile it with `npx npm@10 install` locally.
      - run: npm ci

      # The Setup page installs the public controller firmware (no WiFi secrets, no OTA) from
      # website/public/installer/. Same core and library versions as on the Raspberry Pi.
      - uses: arduino/setup-arduino-cli@v2

      - name: Cache the ESP32 core and the libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.3.10-neopixel-1.15.5-websockets-2.7.2

      - name: Install the ESP32 core and the libraries
        working-directory: .
        env:
          ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "Adafruit NeoPixel@1.15.5" "WebSockets@2.7.2"

      - name: Build the public firmware for the Setup page
        working-directory: .
        run: tools/build-public-firmware.sh

      # The build fails on broken internal links (starlight-links-validator).
      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
