# Servos of the myCobot 280 for Arduino (our own format: no standard robot-description format
# has these). tools/gen_robot.py reads this file and writes the servo tables of the firmware,
# the Control page, the simulator and the Julia package. Edit this file, not the generated files.
#
# Feetech STS-series bus servos, 4096 steps per turn, step 2048 = joint angle 0.
#   id      bus ID
#   sign    joint angle direction against the servo position: angle = sign × (step − 2048) × 360 / 4096
#   model   model number (registers 3–4; docs: system/servos)
#   gains   position-loop gains [P, D, I] (registers 21, 22, 23) that our firmware writes at power-up
#           (2026-10-04; docs: results/servo-dynamics)
#   max_acceleration_register   factory register 85 (× 100 steps/s²): the servo's acceleration limit
#   multi_turn  (optional) our firmware sets phase bit 4 (register 18) and angle limits 0/0 (9–12) at
#               power-up, so the servo reads and moves past one turn (J6 with the gripper cable,
#               2026-10-06; docs: system/servos)
#   wn, zeta                    second-order model of the position loop (rad/s, -), fitted on
#                               2026-10-04 inside the acceleration limit (docs: results/servo-dynamics)

steps_per_turn: 4096
center_step: 2048
joints:
  joint2_to_joint1:      { id: 1, sign: -1, model: 0x0809, gains: [32, 4, 16], max_acceleration_register: 50,  wn: 14.8, zeta: 0.82 }
  joint3_to_joint2:      { id: 2, sign: -1, model: 0x0809, gains: [32, 4, 16], max_acceleration_register: 50,  wn: 14.7, zeta: 0.75 }
  joint4_to_joint3:      { id: 3, sign: 1,  model: 0x0809, gains: [32, 4, 16], max_acceleration_register: 50,  wn: 14.2, zeta: 0.78 }
  joint5_to_joint4:      { id: 4, sign: -1, model: 0x0709, gains: [32, 8, 0],  max_acceleration_register: 250, wn: 34.4, zeta: 0.65 }
  joint6_to_joint5:      { id: 5, sign: -1, model: 0x0209, gains: [32, 8, 0],  max_acceleration_register: 250, wn: 52.4, zeta: 0.77 }
  joint6output_to_joint6: { id: 6, sign: -1, model: 0x0209, gains: [32, 8, 0],  max_acceleration_register: 250, wn: 54.9, zeta: 0.83, multi_turn: true }

# J7: the adaptive gripper (myCobot_gripper_ag; docs: system/gripper), on the same bus. Our firmware (5.0+)
# finds it by its model number and then treats it as a seventh joint: J7, after J6 in every message.
#   id, sign, model, gains, max_acceleration_register   as for the joints above. sign 1: the angle
#                            grows as the gripper opens. gains: the values found on the servo (2026-10-06).
#   closed_step, open_step   the two end stops found by a slow scan at 15 % torque (2026-10-06):
#                            the fingers stall at 1462 (closed) and 2048 (open, the stock calibration
#                            point), 51.5°. Checked with the camera on 2026-10-06. They are the J7 limits:
#                            −51.5° (closed) to 0° (open). Goals stay 2° inside, as for every joint.
#   max_acceleration         the planning limit of our firmware (°/s²), as J4–J6 (joint_limits.yaml)
#   torque                   0-1000, written when the gripper is found to registers 16 (max torque),
#                            28 (protection current) and 48 (torque limit). Elephant's values are 140 / 300 / 300
#                            (30 %); soft objects (a plush head, a cup handle) held only at 1000 (2026-10-06).
#                            Full capability by default: guard against heat, not with a low limit.
#   hot_c, cool_c, hot_torque  thermal derating: above hot_c (°C) the torque limit drops to hot_torque, back to
#                            torque below cool_c. At 1000 the servo stayed at 45-53 °C in 1-2 min holds. The
#                            servo's own limit (register 13, 80 °C) stays as the last guard.
gripper: { id: 7, sign: 1, model: 0x070A, gains: [150, 150, 0], max_acceleration_register: 250,
           closed_step: 1462, open_step: 2048, max_acceleration: 2000,
           torque: 1000, hot_c: 70, cool_c: 60, hot_torque: 500 }
