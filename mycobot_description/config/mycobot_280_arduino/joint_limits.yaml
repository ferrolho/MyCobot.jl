# Joint limits of the myCobot 280 for Arduino, in the ros2_control joint_limits format
# (https://control.ros.org: joint_limits; rad, rad/s, rad/s²). tools/gen_robot.py reads this file
# and writes the URDF <limit> elements and the limit tables of the firmware, the Control page,
# the simulator and the Julia package. Edit this file, not the generated files.
#
# Position: round values inside the end stops measured by hand on 2026-10-04 (the largest multiple
#   of 5° at least 2° inside both stops; docs: system/robot). J6 has no end stop; the gripper
#   cable stops it at −237.1° and +139.9° (2026-10-06): −225° to +135°, one full turn of the
#   gripper. J6 is multi-turn (servos.yaml). At power-up a reading above +135° is one turn lower;
#   within 1.5° of ±135° the turn is not known and the ATOM starts in the error state.
# Velocity: the speed limit of our controller firmware (MOVE_TO, TRACK): 90°/s.
# Acceleration: the planning limit of our firmware, below the servo limit (factory register 85 ×
#   100 steps/s²: 439°/s² on J1–J3, 2197°/s² on J4–J6; docs: results/servo-dynamics).
# Effort: not known (the servo models are not identified).

joint_limits:
  joint2_to_joint1:      # J1, 165°
    has_position_limits: true
    min_position: -2.879793
    max_position: 2.879793
    has_velocity_limits: true
    max_velocity: 1.570796
    has_acceleration_limits: true
    max_acceleration: 6.981317
    has_effort_limits: false
    max_effort: 0.0
  joint3_to_joint2:      # J2, 140°
    has_position_limits: true
    min_position: -2.443461
    max_position: 2.443461
    has_velocity_limits: true
